[project]
name = "cctv-review-svc"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pyyaml",
    "httpx",
    "av",
    "openpyxl",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pytest"]
# measurement only, on the Mac (tools/rag_eval.py --backend sonnet); never installed into the pod envs
cloud-dev = ["anthropic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
