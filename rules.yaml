# Rules catalogue v1. Sources, editions and caveats: RULES.md.
# Quotes are verbatim from the current adilet edition (edition_checked).
# `limitation` (detectable: false rules only) is ignored by the loader; it feeds the README.
version: 1
rules:
  # ---------------------------------------------------------------- catch-all
  - id: other
    name: "Иное возможное нарушение порядка кассовых операций"
    seen_in_training: false
    detectable: true
    severity: medium
    omission: false
    visual_criteria:
      - "cash or valuables are handled in a way that is not controlled by the cashier"
      - "an action with cash that does not match normal acceptance, issuance or cash-collection steps"
    never_claim: ["amount of cash", "whether the operation was posted", "identity of any person", "authenticity of banknotes"]
    grounding_queries:
      - "cash is left unattended on the desk"
      - "a person who is not the cashier reaches into the cash area"
      - "the cashier handles banknotes carelessly and leaves them scattered"
      - "cash changes hands outside the normal service at the cash desk"
    choice_option: "other irregularity in cash handling"
    verify_prompt: "Does the video show cash being handled in a way that is not controlled by the cashier or does not follow normal cash-desk steps?"
    why: "Действия с наличными выглядят не соответствующими порядку кассовых операций, что может указывать на нарушение Правил осуществления кассовых операций; требуется проверка сотрудником."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: ""
        quote: "определяют порядок осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        edition_checked: "2026-10-17"
      - document: "Правила организации охраны и устройства помещений банков второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 24 февраля 2020 года № 14)"
        clause: ""
        quote: "определяют порядок организации охраны и устройства помещений банков второго уровня"
        url: "https://adilet.zan.kz/rus/docs/V2000020075"
        edition_checked: "2026-10-17"

  # ---------------------------------------------------------------- cash left without control
  - id: cash_unattended
    name: "Оставление наличных без присмотра"
    seen_in_training: false
    detectable: true
    severity: high
    omission: false
    visual_criteria:
      - "cash lies exposed on the desk or counter"
      - "the cashier walks away or turns away for a long time"
      - "no employee keeps the exposed cash under control"
    never_claim: ["amount of cash", "whether the operation was posted", "whether any cash went missing"]
    grounding_queries:
      - "the cashier walks away from the desk leaving banknotes on the counter"
      - "cash is left lying on the desk with nobody at the workplace"
      - "the cashier leaves the workplace without locking the cash away"
    choice_option: "cash left unattended"
    verify_prompt: "Does the cashier leave cash lying exposed on the desk while away from the workplace?"
    why: "Наличные остаются открытыми на рабочем месте без контроля кассира, что может указывать на нарушение требования хранить ранее принятые наличные в закрывающихся на ключ устройствах на рабочем месте кассового работника."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 20, ч. 2"
        quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z112"
        edition_checked: "2026-10-17"

  - id: cashier_leaves_during_service
    name: "Уход кассира с рабочего места во время обслуживания клиента"
    seen_in_training: false
    detectable: true
    severity: high
    omission: false
    visual_criteria:
      - "a client is at the cash desk and the transaction is not finished"
      - "the cashier gets up and walks away from the workplace"
      - "the client is left waiting, possibly with cash or documents on the counter"
    never_claim: ["the reason the cashier left", "identity of any person", "whether the transaction was completed in the system"]
    grounding_queries:
      - "the cashier walks away from the desk while a client is still being served"
      - "the cashier leaves the workplace in the middle of a transaction with a client waiting"
      - "a client waits at the cash desk while the cashier is away"
    choice_option: "cashier leaves the workplace during client service"
    verify_prompt: "Does the cashier leave the workplace while a client is still being served?"
    why: "Кассир покидает рабочее место, пока клиент ещё обслуживается, что может указывать на нарушение запрета покидать рабочее место до окончания обслуживания клиента."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 22"
        quote: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z114"
        edition_checked: "2026-10-17"

  - id: previous_cash_on_desk
    name: "Наличные от других операций на рабочем месте при обслуживании клиента"
    seen_in_training: false
    detectable: true
    severity: medium
    omission: false
    visual_criteria:
      - "while a client is served, other stacks of cash that are not part of this client's transaction lie open on the desk"
      - "cash from earlier transactions is not put into a drawer, safe or cash box"
      - "cash of different clients is mixed on the counter"
    never_claim: ["amount of cash", "which client the cash belongs to", "whether the operation was posted"]
    grounding_queries:
      - "stacks of cash from earlier transactions lie open on the desk while the cashier serves the next client"
      - "the cashier serves a new client with other banknotes still spread on the desk"
      - "cash from a previous client is not put away before the next client is served"
    choice_option: "cash from earlier transactions left out on the desk"
    verify_prompt: "While serving a client, does the cashier keep other cash from earlier transactions lying open on the desk instead of in a drawer or safe?"
    why: "На рабочем месте открыто лежат наличные, не относящиеся к текущей операции, что может указывать на нарушение требования держать на рабочем месте только наличные текущего клиента, а ранее принятые наличные хранить в запирающихся устройствах."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 20, ч. 2"
        quote: "На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z112"
        edition_checked: "2026-10-17"

  - id: cash_storage_left_open
    name: "Хранилище наличных на рабочем месте оставлено открытым"
    seen_in_training: false
    detectable: true
    severity: medium
    omission: false
    visual_criteria:
      - "a cash drawer, safe, cash box or trolley holding cash is left open"
      - "keys are left in the lock or lying on the desk"
      - "the cashier is away or busy with something else while it stays open"
    never_claim: ["amount of cash", "the bank's internal key-handling procedure", "whether anything was taken"]
    grounding_queries:
      - "the cash drawer is left open with banknotes inside while the cashier walks away"
      - "the safe at the cashier's workplace stays open and unattended"
      - "keys are left in the lock of the cash drawer"
    choice_option: "cash drawer or safe left open, or keys left in the lock"
    verify_prompt: "Is a cash drawer, safe or cash box left open, or are its keys left in the lock, while no one is controlling it?"
    why: "Запирающееся хранилище наличных на рабочем месте оставлено открытым или с ключом в замке, что может указывать на нарушение требований о хранении наличных в закрывающихся на ключ устройствах и об исключении несанкционированного использования ключей."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 20, ч. 2"
        quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z112"
        edition_checked: "2026-10-17"
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 80"
        quote: "Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z226"
        edition_checked: "2026-10-17"

  - id: cash_into_personal_belongings
    name: "Перемещение наличных в одежду или личные вещи"
    seen_in_training: false
    detectable: true
    severity: high
    omission: false
    visual_criteria:
      - "the cashier or another person puts banknotes into a pocket, sleeve, personal bag or wallet"
      - "the cash does not go into the cash drawer, safe or a collection bag"
      - "the movement may be done discreetly"
    never_claim: ["intent or theft", "amount of cash", "identity of any person", "whether the cash was later returned"]
    grounding_queries:
      - "the cashier slips banknotes into a pocket"
      - "the cashier puts cash into a personal bag"
      - "a banknote is hidden in clothing instead of being put in the cash drawer"
    choice_option: "cash put into a pocket or personal bag"
    verify_prompt: "Does anyone put banknotes into a pocket, clothing or a personal bag instead of the cash drawer or safe?"
    why: "Наличные перемещаются в карман, одежду или личную сумку, что может указывать на нарушение требований о хранении принятых наличных в специальных устройствах на рабочем месте и о хранении личных наличных денег работников вне кассового узла."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 20, ч. 2"
        quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z112"
        edition_checked: "2026-10-17"
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 12, ч. 1"
        quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z81"
        edition_checked: "2026-10-17"

  - id: personal_items_at_workplace
    name: "Личные вещи или смартфон на рабочем месте кассира"
    seen_in_training: false
    detectable: true
    severity: low
    omission: false
    visual_criteria:
      - "the cashier uses a smartphone at the cash workplace"
      - "the cashier photographs or films with a phone at the desk"
      - "a personal handbag, wallet or other personal items are on the cash desk"
    never_claim: ["what the phone was used for", "contents of the phone screen", "who owns the items"]
    grounding_queries:
      - "the cashier uses a mobile phone at the cash desk"
      - "the cashier takes photos with a smartphone at the workplace"
      - "a personal handbag lies on the cashier's desk"
    choice_option: "personal phone or personal items at the cash workplace"
    verify_prompt: "Does the cashier use a smartphone or keep personal items such as a handbag at the cash workplace?"
    why: "На рабочем месте кассира видны личные вещи или используется смартфон, что может указывать на нарушение требования хранить личные вещи работников вне кассового узла (допускаются только средства связи без функции фото- и видеофиксации)."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 12, ч. 1"
        quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z81"
        edition_checked: "2026-10-17"
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 12, ч. 2"
        quote: "Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z490"
        edition_checked: "2026-10-17"

  # ---------------------------------------------------------------- counting
  - id: deposit_not_counted
    name: "Приём наличных без пересчёта"
    seen_in_training: false
    detectable: true
    severity: high
    omission: true
    visual_criteria:
      - "the client hands over banknotes or coins"
      - "the cashier puts the cash straight into a drawer, safe or bag"
      - "no sheet-by-sheet hand count and no counting machine is used for that cash"
    never_claim: ["amount of cash", "authenticity or payability of the banknotes", "whether the amount matches the document", "whether the operation was posted"]
    grounding_queries:
      - "the cashier takes cash from the client and puts it away without counting it"
      - "the cashier puts the client's banknotes straight into the drawer without counting"
      - "a stack of banknotes is accepted without being counted by hand or by machine"
    choice_option: "cash accepted without counting"
    verify_prompt: "Does the cashier accept the client's cash and put it away without counting it by hand or by machine?"
    why: "Наличные клиента убраны без видимого пересчёта, что может указывать на нарушение требования принимать банкноты с полистным пересчётом в присутствии клиента."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 19, подп. 2)"
        quote: "принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег в соответствии с пунктами 57 и 58 Правил"
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z445"
        edition_checked: "2026-10-17"
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 20, ч. 1"
        quote: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z111"
        edition_checked: "2026-10-17"

  - id: deposit_counted_without_client
    name: "Пересчёт принимаемых наличных вне присутствия клиента"
    seen_in_training: false
    detectable: true
    severity: medium
    omission: false
    visual_criteria:
      - "the cashier takes the client's cash away from the counter before counting it"
      - "the cash is counted only after the client has left"
      - "the client cannot see the counting"
    never_claim: ["amount of cash", "whether the count was correct", "identity of any person"]
    grounding_queries:
      - "the cashier carries the client's cash away from the counter to count it elsewhere"
      - "the cashier counts the deposited cash after the client has left"
      - "the client leaves before the cashier counts the money"
    choice_option: "deposited cash counted without the client present"
    verify_prompt: "Is the client's cash counted only after the client has left, or out of the client's sight?"
    why: "Пересчёт принимаемых наличных происходит без клиента, что может указывать на нарушение требования принимать и пересчитывать наличные в присутствии клиента."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 20, ч. 1"
        quote: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z111"
        edition_checked: "2026-10-17"

  - id: withdrawal_not_counted
    name: "Выдача наличных без пересчёта в присутствии клиента"
    seen_in_training: false
    detectable: true
    severity: high
    omission: true
    visual_criteria:
      - "the cashier hands cash to the client"
      - "loose banknotes or an opened or partial bundle are handed over without being counted in front of the client"
      - "a full bundle in intact bank wrapping is not a violation: it may be issued by the amount on the wrapper without a sheet count"
    never_claim: ["amount of cash", "whether the amount matches the document", "whether a wrapped bundle is complete"]
    grounding_queries:
      - "the cashier hands loose banknotes to the client without counting them"
      - "the cashier gives cash to the client without recounting it in front of the client"
      - "cash is passed to the client straight from the drawer without counting"
    choice_option: "cash issued without counting in front of the client"
    verify_prompt: "Does the cashier hand loose or unwrapped cash to the client without counting it in front of the client?"
    why: "Наличные переданы клиенту без видимого пересчёта при клиенте, что может указывать на нарушение требования пересчитывать подготовленные к выдаче наличные в присутствии клиента."
    citations:
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 31, подп. 4)"
        quote: "пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги"
        url: "https://adilet.zan.kz/rus/docs/V1900019680#z454"
        edition_checked: "2026-10-17"
      - document: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня ... (утв. постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2019 года № 231)"
        clause: "п. 32, ч. 1"
