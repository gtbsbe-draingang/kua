# Synthetic per-second VLM-style action logs. One buried violation each; the rest is routine.
# The violating moment is described as plain behaviour (what a camera sees), never named as a breach.
cases:
  - id: leave_workplace
    expect: ["V1900019680:22"]
    log: |
      00:00:01 Кассир сидит за рабочим столом в кабине кассы, смотрит в монитор.
      00:00:03 К окну кассы подходит мужчина в темной куртке.
      00:00:05 Мужчина кладет на лоток паспорт и листок бумаги.
      00:00:07 Кассир берет паспорт, открывает его, смотрит на фото и на мужчину.
      00:00:10 Кассир вводит данные на клавиатуре.
      00:00:14 Принтер печатает документ, кассир берет лист.
      00:00:16 Кассир передает лист через лоток, мужчина расписывается.
      00:00:19 Кассир забирает лист, сверяет подпись, кладет лист в лоток на столе.
      00:00:22 Кассир открывает нижний ящик стола ключом.
      00:00:24 Кассир смотрит в ящик, закрывает его.
      00:00:26 Кассир встает со стула.
      00:00:27 Кассир открывает дверь кабины и выходит, дверь закрывается.
      00:00:30 Мужчина стоит у окна, смотрит в телефон.
      00:00:38 Кабина пуста, на мониторе открыт тот же экран.
      00:00:47 Мужчина оглядывается по сторонам.
      00:00:55 Мужчина кладет телефон в карман, стоит у окна.
      00:01:04 Дверь кабины открывается, кассир заходит с пачкой банкнот в руке.
      00:01:06 Кассир садится, кладет пачку в счетную машину.
      00:01:12 Машина пересчитывает банкноты, на табло цифры.
      00:01:15 Кассир показывает табло мужчине, кладет деньги в лоток.
      00:01:18 Мужчина забирает деньги и паспорт, уходит.
      00:01:21 Кассир вносит данные в компьютер.

  - id: accept_no_count
    expect: ["V1900019680:20", "V1900019680:19"]
    log: |
      00:00:00 Кассир за столом, перед ним монитор, счетная машина, лоток.
      00:00:02 Подходит женщина с сумкой, здоровается.
      00:00:04 Женщина передает удостоверение личности через окно.
      00:00:06 Кассир смотрит на удостоверение, сравнивает фото с лицом женщины.
      00:00:09 Кассир печатает на клавиатуре.
      00:00:12 Женщина достает из сумки пачку купюр, перетянутую резинкой.
      00:00:14 Женщина кладет пачку в лоток.
      00:00:15 Кассир берет пачку, снимает резинку.
      00:00:16 Кассир держит пачку в руке, смотрит в монитор.
      00:00:17 Кассир открывает верхний ящик стола и кладет пачку внутрь.
      00:00:18 Кассир закрывает ящик.
      00:00:20 Кассир печатает документ, передает женщине на подпись.
      00:00:24 Женщина расписывается, возвращает документ.
      00:00:26 Кассир ставит штамп на документе.
      00:00:28 Кассир отдает женщине квитанцию и удостоверение.
      00:00:31 Женщина уходит.
      00:00:34 Подходит следующий клиент.

  - id: payout_no_count
    expect: ["V1900019680:31"]
    log: |
      00:00:00 Кассир за стойкой, клиент — пожилой мужчина — у окна.
      00:00:02 Мужчина передает паспорт.
      00:00:05 Кассир сверяет фото, вводит номер документа.
      00:00:09 Кассир печатает расходный ордер, мужчина расписывается.
      00:00:14 Кассир сверяет подпись с экраном.
      00:00:16 Кассир наклоняется к сейфу под столом, открывает его ключом.
      00:00:19 Кассир достает две пачки банкнот в банковской упаковке.
      00:00:21 Кассир закрывает сейф.
      00:00:22 Кассир кладет обе пачки сразу в лоток и выдвигает его к клиенту.
      00:00:24 Мужчина забирает пачки, кладет во внутренний карман.
      00:00:26 Кассир ставит штамп и подписывает ордер.
      00:00:29 Кассир отдает паспорт.
      00:00:31 Мужчина отходит от окна.
      00:00:33 Кассир делает запись в журнале.

  - id: phone_in_cash_room
    expect: ["V1900019680:12"]
    log: |
      00:00:00 В кабине кассы кассир сортирует квитанции.
      00:00:04 Кассир складывает квитанции в папку.
      00:00:07 Клиентов у окна нет.
      00:00:09 Кассир достает из кармана жакета смартфон.
      00:00:11 Кассир разблокирует смартфон, листает экран.
      00:00:16 Кассир поднимает смартфон и наводит камеру на стол, где лежат пачки банкнот.
      00:00:18 На экране видна вспышка.
      00:00:20 Кассир кладет смартфон экраном вниз рядом с клавиатурой.
      00:00:24 Кассир пересчитывает банкноты в счетной машине.
      00:00:30 Кассир упаковывает банкноты в пачку и кладет в металлический шкаф.
      00:00:34 Кассир закрывает шкаф на ключ.
      00:00:37 К окну подходит клиент.

  - id: stranger_in_cash_room
    expect: ["V1900018545:41", "V2000020075:8", "V2000020075:16", "V1900019680:75"]
    log: |
      00:00:00 Кассир обменного пункта за столом, пересчитывает доллары.
      00:00:05 Кассир кладет доллары в ящик стола.
      00:00:08 Раздается стук в дверь кабины.
      00:00:10 Кассир встает и открывает дверь.
      00:00:11 В кабину заходит мужчина в спортивном костюме без бейджа.
      00:00:13 Мужчина ставит на пол пакет с продуктами.
      00:00:14 Кассир возвращается за стол.
      00:00:16 Мужчина стоит за спиной кассира, смотрит на стол.
      00:00:22 Кассир и мужчина разговаривают.
      00:00:30 Кассир передает мужчине связку ключей.
      00:00:33 Мужчина кладет ключи в карман.
      00:00:41 Мужчина берет пакет и выходит из кабины.
      00:00:43 Кассир закрывает дверь.
      00:00:46 Кассир продолжает работу за компьютером.

  - id: bag_seal_unchecked
    expect: ["V1900019680:24", "V1900019680:107"]
    log: |
      00:00:00 В кассу заходят два инкассатора в форме, один с сумкой.
      00:00:03 Инкассатор кладет сумку на стол кассира.
      00:00:04 Второй инкассатор передает кассиру документ.
      00:00:07 Кассир смотрит документ, расписывается.
      00:00:10 Кассир берет ножницы и сразу разрезает пломбу на сумке.
      00:00:12 Кассир открывает молнию, высыпает пачки банкнот на стол.
      00:00:15 Инкассаторы выходят.
      00:00:17 Кассир раскладывает пачки по номиналу.
      00:00:25 Кассир пересчитывает первую пачку на счетной машине.
      00:00:31 Кассир записывает сумму в журнал.
      00:00:36 Кассир выбрасывает пломбу и сумку в коробку под столом.

  - id: no_detector
    expect: ["V1900019680:19", "V1900019680:36", "V1900019680:57", "V1900019680:9", "V1900019680:41"]
    log: |
      00:00:00 Кассир у окна, клиент передает удостоверение.
      00:00:03 Кассир проверяет документ, вводит данные.
      00:00:07 Клиент кладет в лоток пачку купюр по 10000 тенге.
      00:00:09 Кассир берет пачку и пересчитывает вручную, перебирая купюры пальцами.
      00:00:18 Кассир кладет пачку стопкой на стол.
      00:00:19 Детектор банкнот справа от кассира выключен, экран темный.
      00:00:20 Кассир печатает приходный ордер.
      00:00:23 Клиент расписывается.
      00:00:25 Кассир кладет купюры в ящик и закрывает его на ключ.
      00:00:27 Кассир выдает квитанцию.
      00:00:29 Клиент уходит.

  - id: bundling_alone
    expect: ["V1900019680:42"]
    log: |
      00:00:00 Вечер, касса закрыта для клиентов, шторка на окне опущена.
      00:00:03 Кассир один в кассовой кабине.
      00:00:05 Кассир достает из ящиков стола несколько стопок банкнот.
      00:00:09 Кассир пропускает стопку через счетную машину.
      00:00:14 Кассир сортирует банкноты по номиналу в отдельные стопки.
      00:00:22 Кассир отсчитывает по 100 листов, перетягивает бандеролью.
      00:00:30 Кассир ставит на бандероль штамп и расписывается.
      00:00:36 Кассир складывает корешки в пачку, упаковывает в полиэтилен и запаивает.
      00:00:44 Кассир наклеивает ярлык и пломбирует упаковку.
      00:00:50 В кабине кроме кассира никого нет на протяжении всей записи.
      00:00:52 Кассир кладет упаковку в сейф.

  - id: keys_left
    expect: ["V1900019680:80", "V1900019680:76"]
    log: |
      00:00:00 Кассир открывает ключом ящик-сейф под рабочим столом.
      00:00:03 Кассир достает пачку банкнот, кладет на стол.
      00:00:05 Связка ключей остается висеть в замке ящика.
      00:00:07 Кассир встает и уходит к принтеру в другом конце кабины.
      00:00:12 Второй сотрудник заходит в кабину, проходит мимо стола.
      00:00:15 Ключи по-прежнему торчат из замка.
      00:00:20 Кассир возвращается, садится за стол.
      00:00:24 Кассир обслуживает клиента у окна.
      00:00:40 Клиент уходит, ключи все еще в замке.

  - id: prev_client_money_on_desk
    expect: ["V1900019680:20"]
    log: |
      00:00:00 Кассир принимает от клиента-мужчины пачку купюр, пересчитывает на машине.
      00:00:07 Кассир кладет купюры на правый край стола стопкой.
      00:00:09 Мужчина получает квитанцию и уходит.
      00:00:11 К окну подходит девушка.
      00:00:13 Стопка купюр предыдущего клиента лежит на краю стола.
      00:00:15 Девушка передает удостоверение.
      00:00:18 Кассир проверяет документ, печатает.
      00:00:22 Девушка кладет в лоток деньги.
      00:00:24 Кассир пересчитывает ее деньги в счетной машине на глазах у девушки.
      00:00:30 На краю стола все еще лежит первая стопка.
      00:00:33 Кассир кладет обе стопки вместе в ящик.
      00:00:35 Девушка уходит.

  - id: no_identification
    expect: ["V1900019680:19"]
    log: |
      00:00:00 Клиент заходит в зал, садится на стул у окна кассы.
      00:00:02 Клиент достает купюры из кошелька.
      00:00:03 Клиент сразу протягивает купюры кассиру.
      00:00:04 Кассир берет купюры и кладет в счетную машину.
      00:00:08 Машина показывает сумму, кассир кивает.
      00:00:10 Кассир печатает квитанцию.
      00:00:13 Кассир отдает квитанцию, клиент уходит.
      00:00:15 Документы клиент не показывал, кассир их не спрашивал.

  - id: door_open
    expect: ["V2000020075:16", "V2000020075:8"]
    log: |
      00:00:00 Камера в кабине кассы, видна дверь в служебный коридор.
      00:00:02 Кассир работает с клиентом у окна.
      00:00:05 Дверь кабины приоткрыта, подперта стулом.
      00:00:10 По коридору проходят сотрудники, заглядывают в кабину.
      00:00:18 Кассир пересчитывает деньги клиента.
      00:00:26 Дверь все еще открыта.
      00:00:33 Кассир выдает квитанцию, клиент уходит.
      00:00:40 Дверь открыта до конца записи.
